[package]
name = "coreglow"
version = "0.11.0"
edition = "2021"
description = "Coreglow: lighting effects, profiles and fan control for the Corsair iCUE Commander Core XT on Linux"
license = "GPL-3.0-or-later"
rust-version = "1.85"
repository = "https://github.com/Nexus-SvK/Coreglow"

[lib]
name = "coreglow"
path = "src/lib.rs"

[[bin]]
name = "coreglowd"
path = "src/bin/coreglowd.rs"

[[bin]]
name = "coreglowctl"
path = "src/bin/coreglowctl.rs"

[[bin]]
name = "coreglow"
path = "src/bin/coreglow.rs"

[[bin]]
name = "coreglow-tray"
path = "src/bin/coreglow-tray.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ksni = { version = "0.3.7", features = ["blocking"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
