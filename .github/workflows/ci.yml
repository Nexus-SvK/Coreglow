name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: cargo test --release --locked

      - name: Build .deb
        run: packaging/build-deb.sh

      - name: Packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lintian apt-utils >/dev/null

      - name: Lintian
        run: lintian --info --display-info --fail-on error,warning --suppress-tags-from-file packaging/lintian-suppress target/debian/*.deb

      - name: apt repository check
        run: packaging/test-apt-repo.sh target/debian/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: coreglow-deb
          path: target/debian/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coreglow-deb
          path: dist

      - name: Tag must match Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --title "Coreglow $GITHUB_REF_NAME" --generate-notes

  apt:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: apt-repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coreglow-deb
          path: dist

      - name: Update the apt repository (gh-pages)
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::warning::APT_SIGNING_KEY isn't set; run packaging/apt-key-setup.sh once to publish the apt repository"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils >/dev/null
          packaging/apt-repo.sh dist/*.deb
